name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  DEPS_CACHE_VERSION: v1

jobs:
  build:
    name: Build and test (${{ matrix.arch }} ${{ matrix.config }})
    # Pinned, not windows-latest: the generator below names a specific
    # Visual Studio, and a runner-image roll forward would remove it.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # tests/CMakeLists.txt pins Catch2; hashing it keys the cache so a bumped
      # pin does not restore a stale tree.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ env.DEPS_CACHE_VERSION }}-${{ matrix.arch }}-${{ matrix.config }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: |
            deps-${{ env.DEPS_CACHE_VERSION }}-${{ matrix.arch }}-${{ matrix.config }}-

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

      - name: Package
        if: matrix.config == 'Release'
        run: cpack --config build/CPackConfig.cmake -C Release -B build/package

      - name: Upload artifact
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: sigscan-${{ matrix.arch }}
          path: build/package/*.zip
          if-no-files-found: error

  release:
    name: Attach builds to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          body: |
            An x64 and an x86 zip, each with `sigscan.exe` and the single-header
            library.

            The binaries are **unsigned**. Antivirus software may flag a tool
            that reads another process's memory. Build from source if you would
            rather not take a binary on trust.

            See CHANGELOG.md for what is new and THIRD_PARTY_NOTICES.md for
            licensing (sigscan is MIT, with no third-party dependencies in the
            library itself).
