<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#0f2235"/>
  <rect width="64" height="4" fill="#c0392b"/>
  <!-- A row of bytes being scanned. The middle byte is the match; a target
       bracket in orange sits on it, the way sigscan finds a pattern. -->
  <rect x="6" y="26" width="11" height="12" rx="2.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="19" y="26" width="11" height="12" rx="2.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="27" y="22" width="10" height="20" rx="2.5" fill="#e67e22"/>
  <rect x="34" y="26" width="11" height="12" rx="2.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="47" y="26" width="11" height="12" rx="2.5" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Target brackets around the match. -->
  <path d="M25 16 h-4 v4 M39 16 h4 v4 M25 48 h-4 v-4 M39 48 h4 v-4" fill="none" stroke="#e67e22" stroke-width="3"/>
</svg>
